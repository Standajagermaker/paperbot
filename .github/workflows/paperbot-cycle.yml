
name: PaperBot automatic cycle

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: paperbot-cycle
  cancel-in-progress: false

jobs:
  paperbot:
    runs-on: ubuntu-latest
    timeout-minutes: 2

    steps:
      - name: Execute PaperBot
        env:
          TOKEN: ${{ secrets.PAPERBOT_RUN_SECRET }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "Missing GitHub secret"
            exit 1
          fi

          echo "PaperBot V2 scheduled run: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          curl --fail-with-body \
            --silent --show-error \
            --max-time 90 \
            -w '\\nHTTP status: %{http_code}\\n' \
            -X POST \
            -H "Authorization: Bearer $TOKEN" \
            https://paperbot-delta.vercel.app/api/paperbot-v2-run
          echo "PaperBot V2 cycle completed"
